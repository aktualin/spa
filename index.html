<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Playfair Display & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,900&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'playfair': ['"Playfair Display"', 'serif'],
                        'poppins': ['"Poppins"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-poppins bg-white text-gray-900 min-h-screen flex flex-col justify-center items-center px-4 antialiased">

    <!-- KONTEN UTAMA DI TENGAH -->
    <main class="text-center w-full max-w-4xl mx-auto">
        
        <!-- Judul -->
        <h1 class="font-playfair font-black italic text-5xl md:text-7xl lg:text-8xl text-gray-900 leading-none mb-4 tracking-tight">
            Coming Soon
        </h1>
        
        <!-- Subjudul -->
        <p class="font-poppins text-gray-500 text-base md:text-lg mb-12 md:mb-16 tracking-wide">
            Kami sedang mempersiapkan sesuatu yang luar biasa.
        </p>

        <!-- Countdown Timer -->
        <div class="flex flex-wrap justify-center gap-6 md:gap-12">
            
            <div class="text-center min-w-[70px]">
                <span class="block font-playfair font-bold text-4xl md:text-6xl lg:text-7xl text-gray-900 days">00</span>
                <span class="block font-poppins text-xs md:text-sm text-gray-400 uppercase tracking-[0.2em] mt-2">Days</span>
            </div>

            <div class="text-center min-w-[70px]">
                <span class="block font-playfair font-bold text-4xl md:text-6xl lg:text-7xl text-gray-900 hours">00</span>
                <span class="block font-poppins text-xs md:text-sm text-gray-400 uppercase tracking-[0.2em] mt-2">Hours</span>
            </div>

            <div class="text-center min-w-[70px]">
                <span class="block font-playfair font-bold text-4xl md:text-6xl lg:text-7xl text-gray-900 minutes">00</span>
                <span class="block font-poppins text-xs md:text-sm text-gray-400 uppercase tracking-[0.2em] mt-2">Minutes</span>
            </div>

            <div class="text-center min-w-[70px]">
                <span class="block font-playfair font-bold text-4xl md:text-6xl lg:text-7xl text-gray-900 seconds">00</span>
                <span class="block font-poppins text-xs md:text-sm text-gray-400 uppercase tracking-[0.2em] mt-2">Seconds</span>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="absolute bottom-6 text-gray-400 text-xs font-poppins tracking-wider">
        &copy; <span id="year"></span> All Rights Reserved.
    </footer>

    <!-- JAVASCRIPT -->
    <script>
        // Tahun di Footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Countdown Timer
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 30); 
        targetDate.setHours(targetDate.getHours() + 12);

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                targetDate.setDate(targetDate.getDate() + 30);
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.querySelector('.days').textContent = String(days).padStart(2, '0');
            document.querySelector('.hours').textContent = String(hours).padStart(2, '0');
            document.querySelector('.minutes').textContent = String(minutes).padStart(2, '0');
            document.querySelector('.seconds').textContent = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
